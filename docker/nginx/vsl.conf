server {
    listen 80;
    server_name vsl.agenciatitandev.com;

    # Redirect HTTP to HTTPS (Cloudflare handles SSL, but good practice)
    # If Cloudflare is in Full mode, uncomment the lines below:
    # return 301 https://$host$request_uri;

    # If Cloudflare is in Flexible mode, keep this block as is:
    location / {
        proxy_pass http://:8050;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long API calls (sync can take a while )
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Dash assets (CSS, JS) - cache
    location /_dash-component-suites/ {
        proxy_pass http://server {:8050;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://    listen 443 ssl;:8050;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1h;
        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    # API endpoints
    location /api/ {
        proxy_pass http://    server_name vsl.agenciatitandev.com;:8050;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Longer timeout for sync endpoints
        proxy_read_timeout 300s;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logs
    access_log /var/log/nginx/vsl_dashboard_access.log;
    error_log /var/log/nginx/vsl_dashboard_error.log;
}


server {
    listen 443 ssl;
    server_name vsl.agenciatitandev.com;

    ssl_certificate /etc/letsencrypt/live/vsl.agenciatitandev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsl.agenciatitandev.com/privkey.pem;

    location / {
        proxy_pass http://vsl_dashboard_app:8050;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}