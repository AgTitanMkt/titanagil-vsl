server {
    listen 80;
    server_name vsl.agenciatitandev.com;

    location / {
        proxy_pass http://vsl_dashboard_app:8050;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;

        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    location /_dash-component-suites/ {
        proxy_pass http://vsl_dashboard_app:8050;
        proxy_set_header Host $host;

        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /assets/ {
        proxy_pass http://vsl_dashboard_app:8050;
        proxy_set_header Host $host;

        expires 1h;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://vsl_dashboard_app:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 300s;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    access_log /var/log/nginx/vsl_dashboard_access.log;
    error_log /var/log/nginx/vsl_dashboard_error.log;
}

server {
    listen 443 ssl;
    server_name vsl.agenciatitandev.com;

    ssl_certificate /etc/letsencrypt/live/vsl.agenciatitandev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsl.agenciatitandev.com/privkey.pem;

    location / {
        proxy_pass http://vsl_dashboard_app:8050;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}